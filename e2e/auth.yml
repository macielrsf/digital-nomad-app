appId: com.coffstack.digitalnomadapp
---
- launchApp:
    clearState: true

- runFlow: sign-in.yml

# Sign out
- tapOn:
    text: .*Perfil.*

# The sign-out button is the FlatList footer, below the favorite cities
- scrollUntilVisible:
    element:
      id: 'sign-out-button'
    direction: DOWN
    visibilityPercentage: 50

- tapOn:
    id: 'sign-out-button'

- assertVisible: '.*Bem-vindo.*'
